<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine Learning MCQ Bank — 67 Questions</title>
<style>
:root{--bg:#0a0f1d;--card:#11192c;--card2:#18233b;--text:#f3f6ff;--muted:#aab5cf;--accent:#7787ff;--good:#2fc58a;--bad:#ef5b72;--line:#2a3754}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a2851,#0a0f1d 48%);color:var(--text);font:16px Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:950px;margin:auto;padding:28px 16px 48px}.panel{background:rgba(17,25,44,.94);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 55px #0005}
h1{margin:0 0 6px;font-size:28px}.muted{color:var(--muted)}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:11px 15px;border-radius:12px;cursor:pointer;font-weight:700}.btn.primary{background:var(--accent);border-color:transparent}
.controls,.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.quiz,.result{display:none}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.timer{font-weight:800;color:#fff}
.bar{height:8px;background:#202c47;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar>div{height:100%;width:0;background:var(--accent);transition:.2s}
.q{font-size:21px;line-height:1.5;margin:10px 0 20px}.opt{width:100%;display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:#0d1527;color:var(--text);padding:14px;border-radius:14px;margin:9px 0;cursor:pointer;font-size:16px;line-height:1.4}
.opt:hover{border-color:#7181c9}.letter{min-width:30px;height:30px;border-radius:8px;background:#202c48;display:grid;place-items:center;font-weight:800}
.correct{border-color:var(--good)!important;background:#164333!important}.wrong{border-color:var(--bad)!important;background:#48202b!important}.disabled{cursor:default}
.feedback{min-height:24px;color:var(--muted);font-weight:700}.score{font-size:56px;font-weight:900;text-align:center;margin:15px}
@media(max-width:600px){h1{font-size:23px}.q{font-size:19px}}
</style></head>
<body><div class="wrap">
<div id="home" class="panel"><h1>Machine Learning — MCQ Bank</h1>
<div class="muted">67 questions selected directly from the uploaded PDF.</div>
<div class="stats"><span class="pill"><b>67</b> questions</span><span class="pill">MCQ only</span><span class="pill">30 sec/question</span></div>
<div class="controls"><button class="btn primary" onclick="start('all')">Start All 67</button><button class="btn" onclick="start('random30')">Random 30</button></div>
<p class="muted">Questions whose correct answer is the visually longest choice were removed.</p></div>
<div id="quiz" class="panel quiz"><div class="meta"><span id="prog"></span><span>⏱ <span id="time">30</span>s</span></div>
<div class="bar"><div id="bar"></div></div><div id="q" class="q"></div><div id="opts"></div><div id="fb" class="feedback"></div>
<div class="nav"><button class="btn" id="prev" onclick="prev()">← Previous</button><button class="btn primary" id="next" onclick="next()">Next →</button></div></div>
<div id="result" class="panel result"><div class="muted">Finished</div><div id="score" class="score"></div><div id="res" class="muted"></div>
<div class="controls" style="justify-content:center"><button class="btn primary" onclick="start('all')">Retake</button><button class="btn" onclick="home()">Home</button></div></div>
</div>
<script>
const BANK=[{"qnum": 2, "q": "According to Tom Mitchell, a computer program learns if its performance improves with:", "opts": {"A": "More memory", "B": "Experience", "C": "Faster processors", "D": "Larger storage"}, "section": 1, "id": "S1Q2", "answer": "B"}, {"qnum": 6, "q": "Which performance measure is commonly used in spam classification?", "opts": {"A": "Recall", "B": "Accuracy", "C": "Specificity", "D": "Precision"}, "section": 1, "id": "S1Q6", "answer": "D"}, {"qnum": 8, "q": "Applying ML techniques to discover hidden patterns in large datasets is known as:", "opts": {"A": "Data Compression", "B": "Data Mining", "C": "Data Cleaning", "D": "Data Collection"}, "section": 1, "id": "S1Q8", "answer": "B"}, {"qnum": 9, "q": "Which of the following is NOT a good reason to use Machine Learning?", "opts": {"A": "Adapting to changing environments", "B": "Discovering hidden patterns", "C": "Solving complex problems", "D": "Replacing all computer hardware"}, "section": 1, "id": "S1Q9", "answer": "D"}, {"qnum": 10, "q": "Detecting tumors in brain scans is an example of:", "opts": {"A": "Image Classification", "B": "Semantic Segmentation", "C": "Text Classification", "D": "Regression"}, "section": 1, "id": "S1Q10", "answer": "A"}, {"qnum": 12, "q": "Forecasting a company's revenue for the next year is mainly considered:", "opts": {"A": "Classification", "B": "Regression", "C": "Clustering", "D": "Association Rule Learning B"}, "section": 1, "id": "S1Q12", "answer": "B"}, {"qnum": 14, "q": "Grouping customers according to their purchasing behavior is an example of:", "opts": {"A": "Regression", "B": "Classification", "C": "Clustering", "D": "Feature Extraction"}, "section": 1, "id": "S1Q14", "answer": "C"}, {"section": 1, "qnum": 16, "q": "What distinguishes supervised learning from unsupervised learning?", "opts": {"A": "It always uses neural networks", "B": "It requires labeled training data", "C": "It works only with images", "D": "It cannot make predictions"}, "answer": "B", "id": "S1Q16"}, {"qnum": 17, "q": "Which supervised learning task predicts a continuous numerical value?", "opts": {"A": "Classification", "B": "Regression", "C": "Clustering", "D": "Dimensionality Reduction"}, "section": 1, "id": "S1Q17", "answer": "B"}, {"qnum": 18, "q": "Which supervised learning task predicts predefined categories?", "opts": {"A": "Regression", "B": "Classification", "C": "Clustering", "D": "Association Rule Learning"}, "section": 1, "id": "S1Q18", "answer": "B"}, {"qnum": 21, "q": "What is the primary characteristic of unsupervised learning?", "opts": {"A": "The training data contains labels", "B": "The training data is unlabeled", "C": "The model uses rewards", "D": "The model requires test labels"}, "section": 1, "id": "S1Q21", "answer": "B"}, {"qnum": 22, "q": "Which task is mainly associated with unsupervised learning?", "opts": {"A": "Regression", "B": "Classification", "C": "Clustering", "D": "Object Detection"}, "section": 1, "id": "S1Q22", "answer": "C"}, {"qnum": 23, "q": "Which algorithm is commonly used for clustering?", "opts": {"A": "K-Means", "B": "Logistic Regression", "C": "Linear Regression", "D": "Random Forest"}, "section": 1, "id": "S1Q23", "answer": "A"}, {"qnum": 24, "q": "Which algorithm is mainly used for dimensionality reduction?", "opts": {"A": "Decision Tree", "B": "PCA", "C": "Logistic Regression", "D": "SVM"}, "section": 1, "id": "S1Q24", "answer": "B"}, {"qnum": 26, "q": "Which algorithm is commonly used for association rule learning?", "opts": {"A": "Apriori", "B": "Random Forest", "C": "Decision Tree", "D": "Logistic Regression"}, "section": 1, "id": "S1Q26", "answer": "A"}, {"qnum": 27, "q": "An anomaly detection system is mainly trained using:", "opts": {"A": "Mostly abnormal instances", "B": "Mostly normal instances", "C": "Equal normal and abnormal instances", "D": "Only labeled anomalies Semi-Supervised Learning"}, "section": 1, "id": "S1Q27", "answer": "B"}, {"qnum": 35, "q": "A very high learning rate may cause the model to:", "opts": {"A": "Adapt slowly", "B": "Forget old data quickly", "C": "Never update", "D": "Always improve accuracy"}, "section": 1, "id": "S1Q35", "answer": "B"}, {"qnum": 36, "q": "Which of the following is NOT one of the steps of Feature Engineering?", "opts": {"A": "Model Selection", "B": "Feature Selection", "C": "Feature Extraction", "D": "Creating new features"}, "section": 1, "id": "S1Q36", "answer": "A"}, {"qnum": 43, "q": "Which of the following is a solution for overfitting?", "opts": {"A": "Gather more training data", "B": "Increase noise in data", "C": "Make the model more complex", "D": "Remove all features"}, "section": 1, "id": "S1Q43", "answer": "A"}, {"qnum": 47, "q": "Machine Learning can be defined as the science and art of programming computers to:", "opts": {"A": "Learn from data", "B": "Create hardware", "C": "Increase memory size", "D": "Design networks"}, "section": 1, "id": "S1Q47", "answer": "A"}, {"qnum": 48, "q": "According to Tom Mitchell's definition, a program learns when its performance improves with:", "opts": {"A": "Experience", "B": "Programming language", "C": "Hardware upgrade", "D": "Database size"}, "section": 1, "id": "S1Q48", "answer": "A"}, {"qnum": 49, "q": "In a spam filter system, examples used for learning are called:", "opts": {"A": "Training set", "B": "Test set", "C": "Model parameters", "D": "Features only"}, "section": 1, "id": "S1Q49", "answer": "A"}, {"qnum": 8, "q": "Before selecting algorithms, the first question should be related to:", "opts": {"A": "The business objective", "B": "The programming language", "C": "The hardware specification", "D": "The database type"}, "section": 2, "id": "S2Q8", "answer": "A"}, {"section": 2, "qnum": 14, "q": "The current solution of a problem is useful because it provides:", "opts": {"A": "A reference for performance", "B": "Training labels automatically", "C": "A new algorithm", "D": "The final model"}, "answer": "A", "id": "S2Q14"}, {"qnum": 16, "q": "The California housing price prediction problem is considered:", "opts": {"A": "Supervised learning", "B": "Unsupervised learning", "C": "Reinforcement learning", "D": "Semi-supervised learning"}, "section": 2, "id": "S2Q16", "answer": "A"}, {"qnum": 22, "q": "Which of the following represents one of the main steps of an ML project?", "opts": {"A": "Writing the final report", "B": "Prepare data for ML algorithms", "C": "Buying hardware", "D": "Removing the model"}, "section": 2, "id": "S2Q22", "answer": "A"}, {"qnum": 26, "q": "Before selecting an ML algorithm, the first question should be related to:", "opts": {"A": "The programming language", "B": "The business objective", "C": "The dataset size only", "D": "The computer speed"}, "section": 2, "id": "S2Q26", "answer": "B"}, {"qnum": 29, "q": "One advantage of pipelines is that:", "opts": {"A": "They remove all data", "B": "Components can work independently", "C": "They replace algorithms", "D": "They avoid training"}, "section": 2, "id": "S2Q29", "answer": "A"}, {"qnum": 31, "q": "The California housing prediction problem is considered:", "opts": {"A": "Unsupervised learning", "B": "Supervised learning", "C": "Reinforcement learning", "D": "Semi-supervised learning"}, "section": 2, "id": "S2Q31", "answer": "B"}, {"qnum": 32, "q": "Housing price prediction is an example of:", "opts": {"A": "Classification", "B": "Regression", "C": "Clustering", "D": "Association rules"}, "section": 2, "id": "S2Q32", "answer": "B"}, {"section": 2, "qnum": 33, "q": "A small group of training samples used in Online Learning is called:", "opts": {"A": "Epoch", "B": "Mini-batch", "C": "Label", "D": "Feature"}, "answer": "B", "id": "S2Q33"}, {"qnum": 34, "q": "The housing problem predicts only one output value, so it is:", "opts": {"A": "Multivariate regression", "B": "Univariate regression", "C": "Classification", "D": "Clustering"}, "section": 2, "id": "S2Q34", "answer": "B"}, {"qnum": 36, "q": "RMSE gives higher importance to:", "opts": {"A": "Small errors", "B": "Large errors", "C": "Missing values", "D": "Categorical values"}, "section": 2, "id": "S2Q36", "answer": "A"}, {"qnum": 37, "q": "MAE is less sensitive to outliers compared with:", "opts": {"A": "RMSE", "B": "PCA", "C": "Grid Search", "D": "Cross Validation"}, "section": 2, "id": "S2Q37", "answer": "A"}, {"qnum": 39, "q": "The housing dataset is stored as a:", "opts": {"A": "PDF file", "B": "CSV file", "C": "Image file", "D": "Text document"}, "section": 2, "id": "S2Q39", "answer": "B"}, {"qnum": 40, "q": "How many attributes are available in the housing dataset?", "opts": {"A": "5", "B": "8", "C": "10", "D": "15"}, "section": 2, "id": "S2Q40", "answer": "B"}, {"qnum": 47, "q": "The correlation coefficient ranges between:", "opts": {"A": "0 and 1", "B": "-1 and 1", "C": "-10 and 10", "D": "1 and 100"}, "section": 2, "id": "S2Q47", "answer": "B"}, {"qnum": 53, "q": "Which method removes samples containing missing values?", "opts": {"A": "Normalization", "B": "dropna()", "C": "OneHotEncoder", "D": "GridSearchCV"}, "section": 2, "id": "S2Q53", "answer": "B"}, {"qnum": 54, "q": "SimpleImputer in Scikit-Learn is used for:", "opts": {"A": "Treat missing values", "B": "Hyperparameter tuning", "C": "Visualization", "D": "Classification"}, "section": 2, "id": "S2Q54", "answer": "A"}, {"qnum": 58, "q": "Min-max scaling transforms values typically into:", "opts": {"A": "0 to 1", "B": "-10 to 10", "C": "1 to 100", "D": "Any random range"}, "section": 2, "id": "S2Q58", "answer": "A"}, {"qnum": 61, "q": "A Linear Regression model on training data may suffer from:", "opts": {"A": "Underfitting", "B": "Overfitting always", "C": "Clustering", "D": "Encoding error"}, "section": 2, "id": "S2Q61", "answer": "A"}, {"qnum": 1, "q": "MNIST dataset contains how many handwritten digit images?", "opts": {"A": "60000", "B": "70000", "C": "80000", "D": "100000"}, "section": 3, "id": "S3Q1", "answer": "B"}, {"section": 3, "qnum": 2, "q": "Each MNIST image has a size of:", "opts": {"A": "14×14 pixels", "B": "28×28 pixels", "C": "32×32 pixels", "D": "64×64 pixels"}, "answer": "B", "id": "S3Q2"}, {"qnum": 3, "q": "The number of features in each MNIST image is:", "opts": {"A": "28", "B": "256", "C": "784", "D": "1024"}, "section": 3, "id": "S3Q3", "answer": "C"}, {"section": 3, "qnum": 5, "q": "The MNIST training set contains:", "opts": {"A": "50000 images", "B": "60000 images", "C": "70000 images", "D": "10000 images"}, "answer": "B", "id": "S3Q5"}, {"section": 3, "qnum": 6, "q": "The goal of binary classification in the MNIST example was detecting:", "opts": {"A": "Digit 0", "B": "Digit 5", "C": "Digit 8", "D": "Digit 9"}, "answer": "B", "id": "S3Q6"}, {"qnum": 7, "q": "Which classifier was used for MNIST binary classification?", "opts": {"A": "KMeans", "B": "SGDClassifier", "C": "PCA", "D": "RandomForest only"}, "section": 3, "id": "S3Q7", "answer": "B"}, {"section": 3, "qnum": 9, "q": "The main purpose of K-fold cross-validation is to:", "opts": {"A": "Reduce dataset size", "B": "Train without labels", "C": "Evaluate model performance", "D": "Remove features"}, "answer": "C", "id": "S3Q9"}, {"qnum": 13, "q": "In a confusion matrix, rows represent:", "opts": {"A": "Predicted classes", "B": "Actual classes", "C": "Features", "D": "Models"}, "section": 3, "id": "S3Q13", "answer": "B"}, {"qnum": 14, "q": "A perfect classifier confusion matrix contains values mainly on:", "opts": {"A": "Main diagonal", "B": "First row", "C": "Last column", "D": "Random positions"}, "section": 3, "id": "S3Q14", "answer": "A"}, {"qnum": 19, "q": "Increasing precision usually causes:", "opts": {"A": "Recall increase", "B": "Recall decrease", "C": "Accuracy becomes zero", "D": "No effect"}, "section": 3, "id": "S3Q19", "answer": "B"}, {"qnum": 21, "q": "ROC curve plots:", "opts": {"A": "Precision vs Recall", "B": "TPR vs FPR", "C": "Accuracy vs Loss", "D": "Train vs Test"}, "section": 3, "id": "S3Q21", "answer": "B"}, {"qnum": 22, "q": "A perfect classifier has ROC AUC equal to:", "opts": {"A": "0", "B": "0.5", "C": "1", "D": "2"}, "section": 3, "id": "S3Q22", "answer": "C"}, {"qnum": 23, "q": "A random classifier has ROC AUC approximately:", "opts": {"A": "0", "B": "0.5", "C": "0.75", "D": "1"}, "section": 3, "id": "S3Q23", "answer": "B"}, {"qnum": 25, "q": "One-versus-rest strategy trains:", "opts": {"A": "One classifier only", "B": "One classifier per class", "C": "One classifier per sample", "D": "No classifiers"}, "section": 3, "id": "S3Q25", "answer": "B"}, {"qnum": 26, "q": "For MNIST with 10 classes, OvO requires:", "opts": {"A": "10 classifiers", "B": "20 classifiers", "C": "45 classifiers", "D": "100 classifiers"}, "section": 3, "id": "S3Q26", "answer": "C"}, {"qnum": 29, "q": "Support Vector Machine classifiers are generally:", "opts": {"A": "Multiclass only", "B": "Binary classifiers", "C": "Unsupervised algorithms", "D": "Clustering algorithms"}, "section": 3, "id": "S3Q29", "answer": "B"}, {"qnum": 34, "q": "Feature engineering can help classification by:", "opts": {"A": "Creating useful features", "B": "Removing all labels", "C": "Reducing training samples", "D": "Stopping learning"}, "section": 3, "id": "S3Q34", "answer": "A"}, {"qnum": 35, "q": "Multilabel classification means that one instance can have:", "opts": {"A": "Multiple labels", "B": "Only one label", "C": "No output", "D": "Only numerical output"}, "section": 3, "id": "S3Q35", "answer": "A"}, {"qnum": 37, "q": "A suitable metric for evaluating multilabel classifiers is:", "opts": {"A": "F1 score", "B": "Training loss only", "C": "Image size", "D": "Number of features"}, "section": 3, "id": "S3Q37", "answer": "A"}, {"qnum": 39, "q": "In MNIST multioutput classification, each output represents:", "opts": {"A": "Pixel intensity", "B": "Predicted class only", "C": "Image name", "D": "Training time"}, "section": 3, "id": "S3Q39", "answer": "A"}, {"section": 3, "qnum": 40, "q": "False Positive means:", "opts": {"A": "Negative predicted as positive", "B": "Positive predicted as negative", "C": "Correct positive", "D": "Correct negative"}, "answer": "A", "id": "S3Q40"}, {"section": 3, "qnum": 41, "q": "False Negative means:", "opts": {"A": "Positive predicted as negative", "B": "Negative predicted as positive", "C": "Correct prediction", "D": "True negative"}, "answer": "A", "id": "S3Q41"}, {"section": 3, "qnum": 42, "q": "Specificity measures:", "opts": {"A": "Correctly classified negatives", "B": "Correctly classified positives", "C": "Total predictions", "D": "Model complexity"}, "answer": "A", "id": "S3Q42"}, {"section": 3, "qnum": 44, "q": "A binary classifier is designed to predict:", "opts": {"A": "Continuous values", "B": "Two possible classes", "C": "Multiple clusters", "D": "Feature dimensions"}, "answer": "B", "id": "S3Q44"}, {"qnum": 46, "q": "If a classifier predicts a negative sample correctly, this is called:", "opts": {"A": "True Positive", "B": "False Positive", "C": "True Negative", "D": "False Negative"}, "section": 3, "id": "S3Q46", "answer": "C"}, {"qnum": 47, "q": "Which metric is more important when missing a positive case is very costly?", "opts": {"A": "Precision", "B": "Recall", "C": "Accuracy", "D": "Specificity"}, "section": 3, "id": "S3Q47", "answer": "B"}];let quiz=[],i=0,ans={},timer=null,t=30;
const $=x=>document.getElementById(x);
function sh(a){for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function home(){clearInterval(timer);$('home').style.display='block';$('quiz').style.display='none';$('result').style.display='none'}
function start(mode){clearInterval(timer);quiz=mode==='random30'?sh([...BANK]).slice(0,30):sh([...BANK]);i=0;ans={};$('home').style.display='none';$('result').style.display='none';$('quiz').style.display='block';render()}
function render(){clearInterval(timer);t=30;let q=quiz[i];$('prog').textContent=`Question ${i+1} of ${quiz.length}`;$('time').textContent=t;$('bar').style.width=((i+1)/quiz.length*100)+'%';$('q').textContent=q.q;$('fb').textContent=ans[q.id]||'';$('prev').disabled=i===0;$('next').textContent=i===quiz.length-1?'Finish':'Next →';let o=$('opts');o.innerHTML='';
Object.entries(q.opts).forEach(([l,s])=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${l}</span><span>${esc(s)}</span>`;b.onclick=()=>pick(l);o.appendChild(b)});if(ans[q.id])paint();
timer=setInterval(()=>{t--;$('time').textContent=t;if(t<=0){clearInterval(timer);if(!ans[q.id])ans[q.id]='TIME';paint();setTimeout(next,500)}},1000)}
function pick(l){let q=quiz[i];if(ans[q.id])return;ans[q.id]=l;clearInterval(timer);paint();$('fb').textContent=l===q.answer?'✓ Correct':'✗ Incorrect — correct answer: '+q.answer}
function paint(){let q=quiz[i];document.querySelectorAll('.opt').forEach(b=>{let l=b.querySelector('.letter').textContent;b.classList.add('disabled');if(l===q.answer)b.classList.add('correct');if(ans[q.id]===l&&l!==q.answer)b.classList.add('wrong')})}
function next(){if(i<quiz.length-1){i++;render()}else finish()}function prev(){if(i>0){i--;render()}}
function finish(){clearInterval(timer);let c=quiz.filter(q=>ans[q.id]===q.answer).length;$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=`${c} / ${quiz.length}`;$('res').textContent=`Accuracy: ${Math.round(c/quiz.length*100)}%`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.addEventListener('keydown',e=>{if($('quiz').style.display!=='block')return;if('ABCDE'.includes(e.key.toUpperCase()))pick(e.key.toUpperCase());if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()})
</script></body></html>
